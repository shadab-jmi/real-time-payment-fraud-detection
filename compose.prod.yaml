services:
  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-13.54.79.11.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      frontend: {}
      proxy_api:
        ipv4_address: ${CADDY_PROXY_IP:-172.30.251.2}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  web:
    ports: !reset []
    networks: !override [frontend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/index.html"]

  api:
    ports: !reset []
    networks: !override
      default: {}
      proxy_api:
        ipv4_address: ${API_PROXY_IP:-172.30.251.3}
    environment:
      PUBLIC_ORIGIN: https://${PUBLIC_HOST:-13.54.79.11.sslip.io}
      FORWARDED_ALLOW_IPS: ${CADDY_PROXY_IP:-172.30.251.2}

  grafana:
    ports: !reset []
    networks: !override [default]

networks:
  proxy_api:
    internal: true
    ipam:
      config:
        - subnet: ${CADDY_PROXY_SUBNET:-172.30.251.0/28}

volumes:
  caddy-data:
  caddy-config:
