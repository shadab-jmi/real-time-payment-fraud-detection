services:
  api:
    entrypoint: [python,-m,uvicorn,apps.api.main:app,--host,0.0.0.0,--port,"8000",--reload,--reload-dir,/app/apps,--no-access-log]
    volumes:
      - ./apps/api:/app/apps/api:ro
  worker:
    volumes:
      - ./apps/worker:/app/apps/worker:ro
  web:
    depends_on:
      web-assets:
        condition: service_started
    volumes:
      - ./apps/web/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
  web-assets:
    build:
      context: ./apps/web
      target: build
    command: [node,dev.mjs]
    volumes:
      - ./apps/web/src:/ui/src:ro
      - ./apps/web/dev.mjs:/ui/dev.mjs:ro
      - ./apps/web/index.html:/ui/index.html:ro
