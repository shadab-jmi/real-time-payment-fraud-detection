server {
    listen 8080;
    client_max_body_size 16k;
    location ~ ^/(v1/|health/|openapi\.json$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://web-assets:8081;
        proxy_buffering off;
    }
}
